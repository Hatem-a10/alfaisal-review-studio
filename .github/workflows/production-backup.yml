# Weekly export of the production D1 database into the private R2 bucket
# review-studio-backups (complements D1 Time Travel's 30-day point-in-time restore).
# The dump exists only on the ephemeral runner and in R2: no artifacts, no logs of its content.
# Read-only for D1 data. A D1 export briefly pauses other queries, so it runs at a quiet hour.
name: Production backup

on:
  schedule:
    - cron: '17 0 * * 5'   # Friday 03:17 Riyadh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: backup
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE: review-studio-production
      BUCKET: review-studio-backups
      WRANGLER: wrangler@4.92.0
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check configuration
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "backup environment needs CLOUDFLARE_BACKUP_TOKEN and CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Export production D1
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes "$WRANGLER" d1 export "$DATABASE" --remote --output dump.sql > /dev/null
          [ -s dump.sql ] || { echo "Export is empty"; exit 1; }
          grep -q "CREATE TABLE" dump.sql || { echo "Export has no schema"; exit 1; }
          gzip -9 dump.sql
          echo "Size: $(stat -c %s dump.sql.gz) bytes, sha256 $(sha256sum dump.sql.gz | cut -d' ' -f1)"

      - name: Store in private R2
        working-directory: ${{ runner.temp }}
        run: |
          KEY="d1/$DATABASE/$(date -u +%Y-%m-%dT%H%MZ).sql.gz"
          npx --yes "$WRANGLER" r2 object put "$BUCKET/$KEY" --file dump.sql.gz --content-type application/gzip --remote
          rm -f dump.sql.gz
          echo "### Production backup" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stored \`$BUCKET/$KEY\`" >> "$GITHUB_STEP_SUMMARY"

name: Cloudflare staging checks
on:
  pull_request:
  push:
    branches: [cloudflare-staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: vinext compatibility report
        run: npx --no-install vinext check | tee vinext-compatibility.log
      - name: Reviewed release tests
        run: node scripts/run-reviewed-tests.mjs > existing-tests.log 2>&1
      - name: Report test results
        if: always()
        run: tail -40 existing-tests.log
      - name: Independent staging build
        run: npm run build:staging
      - name: Build isolated production candidate
        run: npm run build:production-candidate
      - name: Verify the compiled production access gate
        run: node scripts/check-production-guard.mjs
      - name: Rehearse encrypted recovery on isolated local bindings
        run: node scripts/production-recovery-drill.mjs
      - name: Validate production bindings without deployment
        run: npx --no-install wrangler deploy --dry-run --config dist/server/wrangler.json
      - name: Retain validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-validation
          path: |
            vinext-compatibility.log
            existing-tests.log
          retention-days: 7
# This workflow never deploys or runs migrations. Staging deployment is a separate,
# explicit operation; production hosting/data have no credentials in this workflow.

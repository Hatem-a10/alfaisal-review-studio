# Owner-approved production release for alfaisal.review.
#
# Manual only (workflow_dispatch). Releases an exact commit that already passed
# "Cloudflare staging checks" on cloudflare-staging. Uploads a new version of
# review-studio-production, deploys it, checks that Cloudflare reports the new
# version at 100% and that alfaisal.review's public sign-in flow responds, and
# rolls back to the previous version if that check fails.
#
# Never runs migrations, never touches D1/R2 data, secrets, routes or DNS.
# Requires the "production" GitHub environment with:
#   secret CLOUDFLARE_API_TOKEN  (Workers Scripts:Edit, Account Settings:Read, D1:Read, R2:Read)
#   vars   CLOUDFLARE_ACCOUNT_ID, PRODUCTION_D1_ID
name: Production release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full SHA on cloudflare-staging that passed staging CI
        required: true
        type: string
      access_mode:
        description: REVIEW_STUDIO_ACCESS for this version (production currently uses open)
        required: true
        default: open
        type: choice
        options: [open, restricted]
      deploy:
        description: Deploy after upload (false = upload the version only)
        required: true
        default: true
        type: boolean
  # main holds only a thin dispatchable caller (.github/workflows/production-release.yml on main)
  # that runs this file from cloudflare-staging, so release logic changes need one PR.
  workflow_call:
    inputs:
      commit_sha: {required: true, type: string}
      access_mode: {required: true, type: string}
      deploy: {required: true, type: boolean}

permissions:
  contents: read
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    # Job-level lock: the thin caller on main holds the workflow-level "production-release" group,
    # and sharing that name between caller and callee deadlocks.
    concurrency:
      group: production-release-job
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      SHA: ${{ inputs.commit_sha }}
      ACCESS_MODE: ${{ inputs.access_mode }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
      CONFIG: dist/server/wrangler.production.prepared.json
      WORKER: review-studio-production
      SITE: https://alfaisal.review
    steps:
      - name: Validate inputs and environment
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "commit_sha must be a full 40-character SHA"; exit 1; }
          [[ "$ACCESS_MODE" =~ ^(open|restricted)$ ]] || { echo "access_mode must be open or restricted"; exit 1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$PRODUCTION_D1_ID" ] \
            || { echo "production environment is missing CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID or PRODUCTION_D1_ID"; exit 1; }

      - name: Check out the exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Verify the commit is staged and passed staging CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git fetch --no-tags origin refs/heads/cloudflare-staging:refs/remotes/origin/cloudflare-staging
          node scripts/verify-reviewed-release.mjs --commit "$SHA" --staging-ref origin/cloudflare-staging \
            --workflow .github/workflows/cloudflare-staging-check.yml

      - name: Build the production candidate
        run: |
          npm run build:production-candidate
          # The build re-gzips lib/learning-payload.ts and the bytes depend on the zlib version.
          # Restore the committed file only when the decompressed content is identical.
          if [ -n "$(git status --porcelain)" ]; then
            [ "$(git status --porcelain)" = " M lib/learning-payload.ts" ] || { git status --porcelain; echo "Unexpected changes after build"; exit 1; }
            git show HEAD:lib/learning-payload.ts > "$RUNNER_TEMP/committed-payload.ts"
            node -e '
              const fs=require("fs"),z=require("zlib"),x=s=>z.gunzipSync(Buffer.from(s.match(/payload = "([^"]+)"/)[1],"base64"));
              if(!x(fs.readFileSync(process.argv[1],"utf8")).equals(x(fs.readFileSync("lib/learning-payload.ts","utf8")))){console.error("Payload content differs");process.exit(1)}
              console.log("Payload content identical; restoring committed bytes");' "$RUNNER_TEMP/committed-payload.ts"
            git checkout -- lib/learning-payload.ts
          fi
          node scripts/check-production-guard.mjs
          node scripts/prepare-production-config.mjs "$PRODUCTION_D1_ID" "$SHA" --access "$ACCESS_MODE"
          node -e 'const c=require(process.argv[1]);console.log(JSON.stringify({vars:c.vars,d1:c.d1_databases[0].database_id,r2:c.r2_buckets[0].bucket_name}))' "$PWD/$CONFIG"

      - name: Dry run
        run: npx --no-install wrangler deploy --dry-run --config "$CONFIG"

      - name: Record the current live version
        id: previous
        run: |
          npx --no-install wrangler deployments status --name "$WORKER" --json > "$RUNNER_TEMP/status.json"
          PREV=$(node -e 'const s=require(process.argv[1]);const v=s.versions?.length===1&&s.versions[0].percentage===100&&s.versions[0];if(!v){console.error("Expected one active production version");process.exit(1)}console.log(v.version_id)' "$RUNNER_TEMP/status.json")
          LIVE_VERSION=$(curl -fsS --max-time 15 -D - -o /dev/null "$SITE/auth/config" | tr -d '\r' | awk 'tolower($1)=="x-review-studio-version:"{print $2}')
          SITE_VERSION=$(node scripts/check-release-version.mjs "$LIVE_VERSION" "$PREV")
          echo "site_version=$SITE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous live version: $PREV"

      - name: Upload new version
        id: upload
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          npx --no-install wrangler versions upload --config "$CONFIG" \
            --tag "release-${SHA:0:7}" --message "Release ${SHA:0:7} (${ACCESS_MODE}) via GitHub Actions run ${GITHUB_RUN_ID}"
          VID=$(node -e '
            const lines=require("fs").readFileSync(process.argv[1],"utf8").trim().split("\n").map(JSON.parse);
            const v=lines.reverse().find(l=>l.type==="version-upload"&&l.version_id);if(!v)process.exit(1);console.log(v.version_id)' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "version=$VID" >> "$GITHUB_OUTPUT"
          echo "Uploaded version: $VID"

      - name: Deploy new version
        if: ${{ inputs.deploy }}
        run: |
          # A freshly uploaded version can take a few seconds to become visible to the API.
          for i in $(seq 1 12); do
            if npx --no-install wrangler versions deploy "${{ steps.upload.outputs.version }}@100%" --name "$WORKER" \
                 --message "Release ${SHA:0:7} via GitHub Actions run ${GITHUB_RUN_ID}" --yes; then
              exit 0
            fi
            echo "Deploy attempt $i failed; retrying in 10s"
            sleep 10
          done
          echo "Could not deploy ${{ steps.upload.outputs.version }}"; exit 1

      - name: Verify the new version is live and alfaisal.review responds
        id: verify
        if: ${{ inputs.deploy }}
        env:
          VID: ${{ steps.upload.outputs.version }}
          SITE_VERSION: ${{ steps.previous.outputs.site_version }}
        run: |
          # Production requires sign-in for everything except the sign-in flow, so build metadata
          # cannot be read anonymously. Check the active version through Cloudflare and the public
          # entry points through HTTP. The owner confirms the commit from a signed-in session.
          for i in $(seq 1 18); do
            npx --no-install wrangler deployments status --name "$WORKER" --json > "$RUNNER_TEMP/after.json" 2>/dev/null || true
            ACTIVE=$(node -e 'try{const s=require(process.argv[1]);const v=(s.versions||[]).find(v=>v.percentage===100);console.log(v?v.version_id:"none")}catch{console.log("unknown")}' "$RUNNER_TEMP/after.json")
            ROOT=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$SITE/?release=$GITHUB_RUN_ID-$i")
            SIGNIN=$(curl -s -o /dev/null -w '%{http_code}' -L "$SITE/auth/sign-in?release=$GITHUB_RUN_ID-$i")
            DISPLAY=$(curl -fsS --max-time 15 -D - -o /dev/null "$SITE/auth/config?release=$GITHUB_RUN_ID-$i" | tr -d '\r' | awk 'tolower($1)=="x-review-studio-version:"{print $2}' || true)
            echo "attempt $i: active=$ACTIVE root=$ROOT sign-in=$SIGNIN"
            if [ "$ACTIVE" = "$VID" ] && [[ "$ROOT" == 303\ */auth/sign-in* ]] && [ "$SIGNIN" = "200" ] && [ "$DISPLAY" = "$SITE_VERSION" ]; then echo "Live and healthy at $DISPLAY"; exit 0; fi
            sleep 10
          done
          echo "Version $VID did not become healthy in time"; exit 1

      - name: Roll back on failed deploy or verification
        if: ${{ failure() && inputs.deploy && steps.previous.outputs.version != '' && steps.upload.outputs.version != '' }}
        run: |
          echo "Rolling back to ${{ steps.previous.outputs.version }}"
          npx --no-install wrangler rollback "${{ steps.previous.outputs.version }}" --name "$WORKER" \
            --message "Automatic rollback: release ${SHA:0:7} failed (run ${GITHUB_RUN_ID})" --yes

      - name: Release receipt
        if: always()
        run: |
          {
            echo "### Production release"
            echo "- Commit: \`$SHA\`"
            echo "- Access mode: \`$ACCESS_MODE\`"
            echo "- Previous version: \`${{ steps.previous.outputs.version }}\`"
            echo "- Site version: ${{ steps.previous.outputs.site_version }}"
            echo "- New version: \`${{ steps.upload.outputs.version }}\`"
            echo "- Deployed: ${{ inputs.deploy }}"
            echo "- Verification: ${{ steps.verify.outcome }}"
            echo "- Migrations: none"
          } >> "$GITHUB_STEP_SUMMARY"

# Dispatchable entry point for production releases. GitHub only dispatches workflows on the
# default branch, so main keeps this thin caller. The release logic (verification, build,
# deploy, health check, rollback) lives in production-release.yml on cloudflare-staging,
# which is PR- and CI-protected. Change release behaviour there, not here.
name: Production release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full SHA on cloudflare-staging that passed staging CI
        required: true
        type: string
      access_mode:
        description: REVIEW_STUDIO_ACCESS for this version (production currently uses open)
        required: true
        default: open
        type: choice
        options: [open, restricted]
      deploy:
        description: Deploy after upload (false = upload the version only)
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    uses: Hatem-a10/alfaisal-review-studio/.github/workflows/production-release.yml@cloudflare-staging
    with:
      commit_sha: ${{ inputs.commit_sha }}
      access_mode: ${{ inputs.access_mode }}
      deploy: ${{ inputs.deploy }}
    secrets: inherit

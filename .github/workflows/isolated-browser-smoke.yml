name: Isolated browser smoke
on:
  pull_request:
    branches: [cloudflare-staging]
  push:
    branches: [cloudflare-staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build:staging
      - name: Install pinned browser runner in disposable directory
        run: |
          npm install --prefix "$RUNNER_TEMP/review-browser" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/review-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Browser checks on local synthetic Worker
        env:
          REVIEW_BROWSER_MODULE: ${{ runner.temp }}/review-browser/node_modules/playwright
        run: node scripts/isolated-browser-smoke.mjs
# No hosting credentials, remote bindings, production data, or deployments.

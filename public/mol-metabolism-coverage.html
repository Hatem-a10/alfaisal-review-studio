<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOL 14–19 · Coverage audit</title><style>body{max-width:1050px;margin:40px auto;padding:0 24px;font:16px/1.6 system-ui;background:#f5f8f6;color:#20352c}a{color:#167450}section,details{padding:18px 24px;border:1px solid #ccdbd2;border-radius:16px;background:white;margin:18px 0}h2{margin:0 0 12px}small{color:#52665a}li{margin:6px 0}@media(prefers-color-scheme:dark){body{background:#080c09;color:#e6f3eb}section,details{background:#111b15;border-color:#344e3b}a{color:#70ddb0}small{color:#a7bcac}}</style></head><body><a href="/#learning">← Review Studio</a><h1>MOL 14–19 · Source & coverage audit</h1><main id="audit">Loading…</main><script>
(async()=>{try{const d=await fetch('/mol-metabolism-coverage.json').then(r=>{if(!r.ok)throw Error('Could not load audit');return r.json()}),root=document.getElementById('audit');root.textContent='';const add=(tag,text,parent=root)=>{const x=document.createElement(tag);x.textContent=text;parent.append(x);return x};add('p',d.sourceReadMethod);let s=add('section','');add('h2','Corrections and scope',s);for(const t of d.corrections)add('p',t,s);for(const e of d.exclusions){add('p','Explicit source exclusion: '+e.quote,s);add('small',e.source+' · slide '+e.page+' · '+e.applied,s)}add('p','No explicit exam-priority statements were verified in this batch. General “key points” are not labeled lecturer exam promises.',s);for(const[id,g]of Object.entries(d.lectures)){const sec=add('section','');add('h2',id+' · '+g.title,sec);add('p',g.topics.length+' topics · '+g.questions+' new MCQs · '+g.fillBlanks+' fill-in exercises · '+g.matching+' matching activities',sec);const list=add('ul','',sec);for(const obj of g.objectives)add('li',obj,list);const detail=add('details','',sec);add('summary','Topic-by-topic teaching and assessment',detail);for(const t of g.topics){add('h3',t.title,detail);add('p',t.questions.length+' explained MCQs · '+t.figures.length+' mapped figures',detail);add('small',t.references.map(r=>r.source+' slide '+r.page).join(' · '),detail)}}const gaps=add('section','');add('h2','Specific source limitations',gaps);for(const g of d.gaps)add('p',g,gaps);const details=add('details','');add('summary','Every source page: reading and disposition',details);for(const s of d.sources){add('h3',s.id+' · '+s.units.length+' units read',details);add('p',s.units.map(u=>u.page+': '+(u.topics.join(', ')||u.disposition)).join('\n'),details).style.whiteSpace='pre-wrap'}}catch(e){document.getElementById('audit').textContent=e.message}})();
</script></body></html>

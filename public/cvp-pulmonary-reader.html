<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulmonary source reader</title><style>body{font:17px/1.65 system-ui,sans-serif;max-width:860px;margin:40px auto;padding:0 22px;color:#203331;background:#f6f8f7}a{color:#18785a}article{white-space:pre-wrap;background:white;border:1px solid #d8e2de;border-radius:14px;padding:24px;margin:20px 0;scroll-margin-top:20px}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}select{font:inherit;padding:8px}small{display:block;color:#57655f}h2{font-size:18px;margin:0 0 12px}@media(prefers-color-scheme:dark){body{background:#080b0a;color:#eee}article{background:#111813;border-color:#334139}small{color:#b6c4bc}}</style></head><body><a href="/#learning">← Review Studio</a><h1 id="title">Supplied source text</h1><p>This is the extracted source text, not the original PDF layout. Reviewed teaching and figures are in Learn & master. Original file storage is handled separately.</p><nav><label>Jump to page/slide <select id="pages"></select></label><a id="lesson" href="/#learning">Open site</a></nav><main id="source" aria-live="polite"></main><script>
(async()=>{try{const sources=await fetch('/cvp-pulmonary-sources.json').then(r=>{if(!r.ok)throw Error('Source unavailable');return r.json()}),code=new URLSearchParams(location.search).get('source'),s=sources.find(s=>s.id===code);if(!s)throw Error('Unknown lecture');document.getElementById('title').textContent=s.displayName;const pages=document.getElementById('pages');for(const p of s.pages){let opt=document.createElement('option');opt.value=p.page;opt.textContent=s.unit+' '+p.page;pages.append(opt);let a=document.createElement('article');a.id='page-'+p.page;let h=document.createElement('h2');h.textContent=s.unit+' '+p.page;let t=document.createElement('div');t.textContent=p.text||'[No extractable text. Refer to the reviewed diagram in the lesson.]';a.append(h,t);document.getElementById('source').append(a)}function jump(){const n=Number(location.hash.match(/page=(\d+)/)?.[1]||1);pages.value=n;document.getElementById('page-'+n)?.scrollIntoView()}pages.onchange=()=>{location.hash='page='+pages.value};addEventListener('hashchange',jump);jump()}catch(e){document.getElementById('source').textContent=e.message}})();</script></body></html>
